    <section class="platform-profile-hero">
      <img class="platform-profile-hero__backdrop" id="platform-profile-image" src="./assets/miic-placeholder.png" alt="机械工业信息中心平台占位图">
      <div class="platform-profile-hero__shade"></div>

        <section class="platform-profile-contact">

            <a href="tel:01068510153">业务咨询：010-68510153</a>
