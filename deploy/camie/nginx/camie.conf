server {
    listen 80;
    server_name __CAMIE_DOMAIN__;

    # TLS 证书与 HTTPS 重定向由运维现有证书流程补充。
    # API location 必须位于前端 location 之前，且 proxy_pass 不带 URI。

    location ^~ /business_portal/api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 900m;
    }

    location ^~ /business_portal/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 故意不配置 /business_portal/private_uploads/；私有文件只能走签名 API。

    location ^~ /business_member/api/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 25m;
    }

    location ^~ /business_member/uploads/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /business_portal/ {
        root /opt/camie/current/web;
        try_files $uri $uri/ /business_portal/index.html;
        index index.html;
    }

    location ^~ /business_member/ {
        root /opt/camie/current/web;
        try_files $uri $uri/ /business_member/index.html;
        index index.html;
    }

    location ~* \.(?:html|js|css)$ {
        root /srv/camie/site;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        root /srv/camie/site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
