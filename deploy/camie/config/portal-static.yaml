version: 1
driver: camie

site:
  id: camie
  timezone: Asia/Shanghai

database:
  dsn_env: CAMIE_DB_DSN
  schema: camie_portal
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 5m

server:
  addr: 127.0.0.1:9144
  token_env: CAMIE_STATIC_TOKEN
  request_timeout: 10m
  batch_idle_timeout: 15m
  batch_max_duration: 6h

paths:
  source_root: /opt/camie/current/share/camie-site
  dist_root: /srv/camie/site
  allowed_output_root: /srv/camie/site
  preview_root: /srv/camie/preview
  templates:
    layout: /opt/camie/current/share/camie-preview-templates/layout.html.tmpl
    home: /opt/camie/current/share/camie-preview-templates/home.html.tmpl
    list: /opt/camie/current/share/camie-preview-templates/list.html.tmpl
    article: /opt/camie/current/share/camie-preview-templates/article.html.tmpl
    about: /opt/camie/current/share/camie-preview-templates/about.html.tmpl
  template_codes:
    layout: camie-layout
    home: camie-home
    party: camie-party
    ministry: camie-ministry
    news: camie-news
    training: camie-training
    standards: camie-standards
    list: camie-list
    article: camie-article
    about: camie-about

media:
  mode: same_origin
  aliases:
    camie/uploads: /camie/uploads
    uploads: /uploads
  rewrite_origins:
    - https://demo.miic.com.cn

adapter:
  site:
    page_name: 环保机械协会
    page_size: 10
    hero_column: news-hot
    fallback_cover: assets/images/default-news-cover.png
    lock_stale_after: 30m
    member_login_path: /business_member/login
    member_register_path: /business_member/register
